name: Dependency Audit

on:
  push:
    paths:
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime lock
        run: python -m pip_audit --no-deps -r requirements.lock

      - name: Audit development lock
        run: python -m pip_audit --no-deps -r requirements-dev.lock

      - name: Audit optional AI lock
        run: python -m pip_audit --no-deps -r requirements-ai.lock
