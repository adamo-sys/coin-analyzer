name: Quality Advisory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyright-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright

      - name: Measure type-checking debt
        run: pyright

  hypothesis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies and Hypothesis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis

      - name: Run bounded property-based pilot
        run: python -m unittest tests.test_property_based_quality_pilot
