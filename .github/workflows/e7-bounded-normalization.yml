name: E7 bounded normalization

on:
  pull_request:
    paths:
      - "capture_import/recognition30_e7_gallery_audit.py"
      - "tests/test_recognition30_e7_gallery_audit.py"
      - ".github/workflows/e7-bounded-normalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_recognition30_e7_gallery_audit.py -q
