name: Mutmut Advisory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-mutation-pilot:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install mutmut==3.7.0

      - name: Verify focused reviewer tests
        run: python -m pytest test_reviewer_agent.py -q

      - name: Run bounded mutation pilot
        id: mutation
        shell: bash
        run: |
          if mutmut run; then
            code=0
          else
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Capture mutation results and survivor diffs
        if: always()
        env:
          MUTMUT_RUN_OUTCOME: ${{ steps.mutation.outcome }}
          MUTMUT_RUN_EXIT_CODE: ${{ steps.mutation.outputs.exit_code }}
        run: python tools/capture_mutmut_evidence.py

      - name: Upload advisory mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutmut-reviewer-evidence
          path: artifacts/
          if-no-files-found: warn
