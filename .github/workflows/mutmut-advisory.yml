name: Mutmut Advisory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-mutation-pilot:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install mutmut==3.7.0

      - name: Verify focused reviewer tests
        run: python -m pytest test_reviewer_agent.py -q

      - name: Run bounded mutation pilot
        run: mutmut run

      - name: Capture mutation results
        if: always()
        run: |
          mkdir -p artifacts
          mutmut results | tee artifacts/mutmut-results.txt || true

      - name: Upload advisory mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-reviewer-evidence
          path: artifacts/mutmut-results.txt
          if-no-files-found: warn
