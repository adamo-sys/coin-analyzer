name: Mutmut Advisory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-mutation-pilot:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install mutmut==3.7.0

      - name: Verify focused reviewer tests
        run: python -m pytest test_reviewer_agent.py -q

      - name: Run bounded mutation pilot
        run: mutmut run

      - name: Capture mutation results and survivor diffs
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p artifacts

          mutmut results | tee artifacts/mutmut-results.txt || true

          : > artifacts/mutmut-survivor-diffs.txt

          mapfile -t survivors < <(
            sed -n 's/^[[:space:]]*\([^:]*\): survived[[:space:]]*$/\1/p' \
              artifacts/mutmut-results.txt
          )

          {
            echo "Mutmut survivor detail evidence"
            echo "================================"
            echo "Survivor count: ${#survivors[@]}"
            echo
          } >> artifacts/mutmut-survivor-diffs.txt

          if [ "${#survivors[@]}" -eq 0 ]; then
            echo "No surviving mutants." >> artifacts/mutmut-survivor-diffs.txt
          else
            for mutant in "${survivors[@]}"; do
              {
                echo
                echo "========================================================================"
                echo "MUTANT: $mutant"
                echo "========================================================================"
              } >> artifacts/mutmut-survivor-diffs.txt

              mutmut show "$mutant" \
                >> artifacts/mutmut-survivor-diffs.txt 2>&1 || true
            done
          fi

          echo
          echo "=== Survivor diff evidence ==="
          cat artifacts/mutmut-survivor-diffs.txt

      - name: Upload advisory mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-reviewer-evidence
          path: artifacts/
          if-no-files-found: warn
