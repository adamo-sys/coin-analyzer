name: SEC003-451 one-shot CI identity receipt

on:
  pull_request:
    types: [opened]
    branches:
      - sec003/gitleaks-corrective-candidate-05

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event.pull_request.head.ref == 'sec003/ci-identity-receipt-01' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Prepare complete Git objects for security scanning
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Full-history scanning is authorized to transfer historical objects.
          # Sparse checkout only limits worktree materialization.
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          fetch_status=0
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --refetch --no-filter origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' \
            "+$CI_SHA:refs/ci/security-event" >/dev/null 2>&1 || fetch_status=$?
          export SECURITY_FETCH_AUTH="$auth"
          unset auth CI_TOKEN
          printf 'security-diagnostic fetch_exit=%s\n' "$fetch_status"
          test "$fetch_status" -eq 0
          shallow_status=0
          shallow=$(git rev-parse --is-shallow-repository 2>/dev/null) || shallow_status=$?
          case "$shallow" in true|false) ;; *) shallow=UNKNOWN ;; esac
          printf 'security-diagnostic shallow_exit=%s shallow=%s\n' "$shallow_status" "$shallow"
          test "$shallow_status" -eq 0
          { test "$(git rev-parse --is-shallow-repository)" = false; } 2>/dev/null
          export GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          inventory_status=0
          git rev-list --objects --all --missing=print --no-object-names > "$RUNNER_TEMP/security-object-inventory.txt" 2>/dev/null || inventory_status=$?
          printf 'security-diagnostic inventory_exit=%s\n' "$inventory_status"
          test "$inventory_status" -eq 0
          # Only promised, reachable blobs may be hydrated; never emit Git output.
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess


          def probe(*args):
              result = subprocess.run(["git", *args], stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, timeout=120, check=False)
              if result.returncode:
                  raise ValueError("Git metadata check failed")
              return result.stdout.decode("utf-8", errors="strict")

          try:
              inventory = pathlib.Path(os.environ["RUNNER_TEMP"], "security-object-inventory.txt")
              oid_pattern = r"[0-9a-f]{40}|[0-9a-f]{64}"
              def missing_ids(text):
                  missing = set()
                  for line in text.splitlines():
                      if line.startswith("?"):
                          oid = line[1:]
                          if not re.fullmatch(oid_pattern, oid):
                              raise ValueError("Malformed inventory")
                          missing.add(oid)
                  return missing

              missing = missing_ids(inventory.read_text())
              # This traversal rejects missing non-promised objects before network I/O.
              probe("rev-list", "--objects", "--all", "--missing=allow-promisor",
                    "--no-object-names")
              info = probe("rev-list", "--objects", "--all", "--missing=print-info",
                           "--no-object-names")
              blobs = set()
              for line in info.splitlines():
                  if not line.startswith("?"):
                      continue
                  oid = line.split(" ", 1)[0][1:]
                  if not re.fullmatch(oid_pattern, oid) or not line.endswith(" type=blob"):
                      raise ValueError("Only missing blobs are authorized")
                  blobs.add(oid)
              if blobs != missing:
                  raise ValueError("Inconsistent inventory")
              print(f"security-diagnostic hydration_requested={len(missing)}")
              auth = os.environ.pop("SECURITY_FETCH_AUTH")
              if missing:
                  env = dict(os.environ)
                  # Keep credentials out of argv; IDs use byte-oriented stdin.
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
                  result = subprocess.run(
                      ["git", "fetch", "--refetch", "--no-filter", "--no-tags",
                       "--no-recurse-submodules", "--no-write-fetch-head", "--refmap=",
                       "--stdin", "origin"],
                      input=("\n".join(sorted(missing)) + "\n").encode("ascii"),
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      env=env, timeout=120, check=False)
                  if result.returncode:
                      raise ValueError("Targeted fetch failed")
              complete = probe("rev-list", "--objects", "--all", "--missing=print",
                               "--no-object-names")
              inventory.write_text(complete)
              if missing_ids(complete):
                  raise ValueError("Incomplete hydration")
              print("security-diagnostic hydration_complete=true")
          except Exception:  # noqa: BLE001 - Never disclose raw Git/OS exception metadata.
              print("::error::Targeted security object hydration failed")
              raise SystemExit(1)
          PY
          unset SECURITY_FETCH_AUTH
          if grep -q '^?' "$RUNNER_TEMP/security-object-inventory.txt"; then
            echo '::error::Full-history security scan requires complete Git objects'
            exit 1
          fi
          rm -- "$RUNNER_TEMP/security-object-inventory.txt"

      - name: Prepare pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full Git history and emit metadata-only receipt
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/sec003-ci-identities-private.json"
          trap 'rm -f -- "$report"' EXIT
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config=.gitleaks.toml \
            --log-opts="--full-history --all --root -m --no-ext-diff --no-textconv" \
            --redact=100 --exit-code=2 --log-level=error \
            --report-format=json --report-path="$report" >/dev/null 2>&1 || status=$?
          export SEC003_SCAN_STATUS="$status" SEC003_PRIVATE_REPORT="$report"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          try:
              status = int(os.environ['SEC003_SCAN_STATUS'])
              path = pathlib.Path(os.environ['SEC003_PRIVATE_REPORT'])
              if status not in (0, 2) or (status == 2 and not path.is_file()):
                  raise ValueError('invalid scanner status or report')
              records = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else []
              if not isinstance(records, list) or len(records) > 500:
                  raise ValueError('invalid report structure')
              rows = []
              for record in records:
                  if not isinstance(record, dict):
                      raise ValueError('invalid record')
                  rule, file, commit = (record.get(k) for k in ('RuleID', 'File', 'Commit'))
                  start, end = record.get('StartLine'), record.get('EndLine')
                  if (not isinstance(rule, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,64}', rule)
                      or not isinstance(file, str) or not file or len(file) > 4096
                      or not isinstance(commit, str) or not re.fullmatch(r'[0-9a-f]{40,64}', commit)
                      or type(start) is not int or type(end) is not int
                      or start < 1 or end < start):
                      raise ValueError('unsafe metadata')
                  identity = json.dumps([rule, file, commit, start, end], separators=(',', ':'), ensure_ascii=False)
                  digest = lambda value: hashlib.sha256(value.encode('utf-8')).hexdigest()
                  rows.append({'rule_id': rule, 'path_sha256': digest(file), 'commit': commit,
                               'start_line': start, 'end_line': end, 'identity_sha256': digest(identity)})
              if (status == 0 and rows) or (status == 2 and not rows):
                  raise ValueError('scanner/report mismatch')
              rows.sort(key=lambda x: (x['commit'], x['path_sha256'], x['start_line'], x['identity_sha256']))
              receipt = {'schema': 'SEC003-451-CI-METADATA-RECEIPT-V1',
                         'event_sha': os.environ.get('GITHUB_SHA', ''),
                         'scanner_version': '8.24.3', 'scan_exit_code': status,
                         'finding_count': len(rows), 'findings': rows}
              canonical = json.dumps(receipt, separators=(',', ':'), sort_keys=True)
              print('SEC003_CI_IDENTITY_RECEIPT=' + canonical)
              print('SEC003_CI_IDENTITY_RECEIPT_SHA256=' + hashlib.sha256(canonical.encode('utf-8')).hexdigest())
          except Exception:
              print('::error::Sanitized receipt unavailable; raw findings withheld')
              sys.exit(1)
          PY
          exit "$status"
