name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Run syntax-level Ruff checks
        run: ruff check . --select E9 --exclude .venv

  pyright-event-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright==1.1.411

      - name: Type-check cleaned boundaries
        run: pyright event_bus.py image_analyzer.py denomination_label_audit.py market_intelligence_automation.py photo_inbox.py confirmed_observation_evaluator.py diagnostic_agent.py improvement_agent.py retrieval_contracts.py

  openai-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install optional OpenAI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt

      - name: Verify OpenAI SDK surfaces without network access
        run: |
          python - <<'PY'
          import openai_collection_assistant
          from capture_import import visual_identity_provider
          from openai import OpenAI

          client = OpenAI(api_key="sk-ci-smoke-test")
          assert callable(client.responses.create)
          assert callable(client.responses.parse)
          assert openai_collection_assistant.OpenAIResponsesAdapter.provider_name == "OpenAI"
          assert visual_identity_provider.OPENAI_VISUAL_PROVIDER_ID == "openai-responses-visual"
          print("OpenAI optional dependency smoke check passed")
          PY

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # These uncertain-provenance images are local-only and unavailable to CI.
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify architecture and privacy boundaries
        run: >-
          python -m unittest
          tests.test_sprint19_ocr_review_package_boundaries
          tests.test_evaluation_case_contract
          tests.test_repository_privacy_boundaries
          tests.test_legacy_recognition_orchestration
          tests.test_legacy_coin_recognition_capability
          tests.test_legacy_recognition_integration

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"
