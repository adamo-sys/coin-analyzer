name: Tests
run-name: Prospective PR 392 provenance (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 498b886c8dd215844356c9f2acf704066263373a
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Verify pinned PR metadata before object preparation
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          try:
              request = urllib.request.Request('https://api.github.com/repos/adamo-sys/coin-analyzer/pulls/392', headers={'Authorization': 'Bearer ' + os.environ['CI_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              assert data['state'] == 'open' and data['merged'] is False
              assert data['head']['sha'] == '498b886c8dd215844356c9f2acf704066263373a'
              assert data['base']['sha'] == '2ea1917ab702809b4e2961c55bf9507297e7257e'
              assert data['merge_commit_sha'] == '53895b766fcfb3b7474ecbf8fbaf9b150ff7123d'
              print('prospective-provenance {"kind":"pr-precheck","pinned_identity_match":true}')
          except Exception:
              print('::error::Pinned PR metadata mismatch or unavailable; raw response suppressed')
              raise SystemExit(1)
          PY

      - name: Prepare complete Git objects for security scanning
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: 53895b766fcfb3b7474ecbf8fbaf9b150ff7123d
        run: |
          set -euo pipefail
          # Full-history scanning is authorized to transfer historical objects.
          # Sparse checkout only limits worktree materialization.
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          fetch_status=0
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --refetch --no-filter origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' \
            "+$CI_SHA:refs/ci/security-event" >/dev/null 2>&1 || fetch_status=$?
          export SECURITY_FETCH_AUTH="$auth"
          unset auth CI_TOKEN
          printf 'security-diagnostic fetch_exit=%s\n' "$fetch_status"
          test "$fetch_status" -eq 0
          shallow_status=0
          shallow=$(git rev-parse --is-shallow-repository 2>/dev/null) || shallow_status=$?
          case "$shallow" in true|false) ;; *) shallow=UNKNOWN ;; esac
          printf 'security-diagnostic shallow_exit=%s shallow=%s\n' "$shallow_status" "$shallow"
          test "$shallow_status" -eq 0
          { test "$(git rev-parse --is-shallow-repository)" = false; } 2>/dev/null
          export GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          inventory_status=0
          git rev-list --objects --all --missing=print --no-object-names > "$RUNNER_TEMP/security-object-inventory.txt" 2>/dev/null || inventory_status=$?
          printf 'security-diagnostic inventory_exit=%s\n' "$inventory_status"
          test "$inventory_status" -eq 0
          # Only promised, reachable blobs may be hydrated; never emit Git output.
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess


          def probe(*args):
              result = subprocess.run(["git", *args], stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, timeout=120, check=False)
              if result.returncode:
                  raise ValueError("Git metadata check failed")
              return result.stdout.decode("utf-8", errors="strict")

          try:
              inventory = pathlib.Path(os.environ["RUNNER_TEMP"], "security-object-inventory.txt")
              oid_pattern = r"[0-9a-f]{40}|[0-9a-f]{64}"
              def missing_ids(text):
                  missing = set()
                  for line in text.splitlines():
                      if line.startswith("?"):
                          oid = line[1:]
                          if not re.fullmatch(oid_pattern, oid):
                              raise ValueError("Malformed inventory")
                          missing.add(oid)
                  return missing

              missing = missing_ids(inventory.read_text())
              # This traversal rejects missing non-promised objects before network I/O.
              probe("rev-list", "--objects", "--all", "--missing=allow-promisor",
                    "--no-object-names")
              info = probe("rev-list", "--objects", "--all", "--missing=print-info",
                           "--no-object-names")
              blobs = set()
              for line in info.splitlines():
                  if not line.startswith("?"):
                      continue
                  oid = line.split(" ", 1)[0][1:]
                  if not re.fullmatch(oid_pattern, oid) or not line.endswith(" type=blob"):
                      raise ValueError("Only missing blobs are authorized")
                  blobs.add(oid)
              if blobs != missing:
                  raise ValueError("Inconsistent inventory")
              print(f"security-diagnostic hydration_requested={len(missing)}")
              auth = os.environ.pop("SECURITY_FETCH_AUTH")
              if missing:
                  env = dict(os.environ)
                  # Keep credentials out of argv; IDs use byte-oriented stdin.
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
                  result = subprocess.run(
                      ["git", "fetch", "--refetch", "--no-filter", "--no-tags",
                       "--no-recurse-submodules", "--no-write-fetch-head", "--refmap=",
                       "--stdin", "origin"],
                      input=("\n".join(sorted(missing)) + "\n").encode("ascii"),
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      env=env, timeout=120, check=False)
                  if result.returncode:
                      raise ValueError("Targeted fetch failed")
              complete = probe("rev-list", "--objects", "--all", "--missing=print",
                               "--no-object-names")
              inventory.write_text(complete)
              if missing_ids(complete):
                  raise ValueError("Incomplete hydration")
              print("security-diagnostic hydration_complete=true")
          except Exception:  # noqa: BLE001 - Never disclose raw Git/OS exception metadata.
              print("::error::Targeted security object hydration failed")
              raise SystemExit(1)
          PY
          unset SECURITY_FETCH_AUTH
          if grep -q '^?' "$RUNNER_TEMP/security-object-inventory.txt"; then
            echo '::error::Full-history security scan requires complete Git objects'
            exit 1
          fi
          rm -- "$RUNNER_TEMP/security-object-inventory.txt"

      - name: Prepare pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Capture sanitized prospective scanner provenance
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import sys

          SOURCE = '498b886c8dd215844356c9f2acf704066263373a'
          BASE = '2ea1917ab702809b4e2961c55bf9507297e7257e'
          EVENT = '53895b766fcfb3b7474ecbf8fbaf9b150ff7123d'
          CONFIG = '0238323f4229e48dfa5f19d273b558e07fa51bad8f49656d53a415e45ddcad51'
          IGNORE = 'd7274feab84b044eab540058a989a5b65e3044104e89801729d57e40e08c9283'
          ARCHIVE = '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
          BINARY = 'e18325d568268b6efb6cd0cc721f8bea5667f4cd1c8d03618ab61987f41269ad'


          def sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def probe(*args):
              p = subprocess.run(args, capture_output=True, timeout=120, check=False)
              if p.returncode:
                  raise ValueError('metadata command failed')
              return p.stdout


          def safe_findings(raw, status):
              if status not in (0, 2):
                  raise ValueError('scanner error')
              try:
                  rows = json.loads(raw)
              except (ValueError, UnicodeError):
                  raise ValueError('invalid report') from None
              if rows is None and status == 0:
                  rows = []
              if not isinstance(rows, list) or bool(rows) != (status == 2):
                  raise ValueError('inconsistent report')
              safe = []
              for row in rows:
                  if not isinstance(row, dict) or row.get('Secret') not in ('', 'REDACTED'):
                      raise ValueError('unredacted report')
                  file = row.get('File')
                  rule = row.get('RuleID')
                  commit = row.get('Commit')
                  start, end = row.get('StartLine'), row.get('EndLine')
                  if (not isinstance(file, str) or not re.fullmatch(r'[A-Za-z0-9_. /@+()-]+', file)
                          or file.startswith('/') or any(p in ('', '.', '..') for p in file.split('/'))
                          or str(PurePosixPath(file)) != file):
                      raise ValueError('unsafe path')
                  if not isinstance(rule, str) or not re.fullmatch(r'[a-zA-Z0-9_-]+', rule):
                      raise ValueError('unsafe rule')
                  if not isinstance(commit, str) or not re.fullmatch(r'[0-9a-f]{40}', commit):
                      raise ValueError('unsafe commit')
                  if type(start) is not int or type(end) is not int or start < 1 or end < start:
                      raise ValueError('unsafe lines')
                  if row.get('Fingerprint') != f'{commit}:{file}:{rule}:{start}':
                      raise ValueError('inconsistent fingerprint')
                  safe.append({k: row[k] for k in ('File', 'StartLine', 'EndLine', 'RuleID', 'Commit', 'Fingerprint')})
              return safe


          def refs():
              raw = probe('git', 'for-each-ref', '--format=%(refname) %(objectname)')
              result = []
              for line in raw.decode('ascii').splitlines():
                  if not re.fullmatch(r'refs/[A-Za-z0-9_./@+()-]+ [0-9a-f]{40}', line):
                      raise ValueError('unsafe ref metadata')
                  result.append(line)
              return result


          def emit(kind, value):
              print('prospective-provenance ' + json.dumps({'kind': kind, **value}, sort_keys=True), flush=True)


          def main():
              if probe('git', 'rev-parse', 'HEAD').decode().strip() != SOURCE:
                  raise ValueError('source drift')
              if probe('git', 'rev-parse', '--is-shallow-repository').strip() != b'false':
                  raise ValueError('shallow history')
              for ref, expected in [('refs/remotes/origin/fix/ci-policy-security-hardening', SOURCE),
                                    ('refs/remotes/origin/main', BASE), ('refs/ci/security-event', EVENT)]:
                  if probe('git', 'rev-parse', ref).decode().strip() != expected:
                      raise ValueError('ref drift')
              for file, expected in [('.gitleaks.toml', CONFIG), ('.gitleaksignore', IGNORE)]:
                  raw = Path(file).read_bytes()
                  if sha(raw) != expected or raw != probe('git', 'show', SOURCE + ':' + file):
                      raise ValueError('configuration drift')
              if len(Path('.gitleaksignore').read_text().splitlines()) != 6:
                  raise ValueError('exclusion drift')
              tool = Path(os.environ['RUNNER_TEMP']) / 'gitleaks'
              binary = tool / 'gitleaks'
              if sha(binary.read_bytes()) != BINARY or sha((tool / 'gitleaks.tar.gz').read_bytes()) != ARCHIVE:
                  raise ValueError('scanner drift')
              if probe(str(binary), 'version').strip() != b'8.24.3':
                  raise ValueError('scanner version drift')
              inventory = probe('git', 'rev-list', '--objects', '--all', '--missing=print', '--no-object-names')
              if any(not re.fullmatch(rb'[0-9a-f]{40}', line) for line in inventory.splitlines()):
                  raise ValueError('incomplete objects')
              before = refs()
              argv = [str(binary), 'git', '.', '--config=.gitleaks.toml',
                      '--log-opts=--full-history --all --root -m --no-ext-diff --no-textconv',
                      '--redact=100', '--exit-code=2', '--log-level=info',
                      '--report-format=json', '--report-path=/dev/stdout']
              # Workflow metadata are fixed-shape fields, never an environment dump.
              workflow_sha = os.environ['GITHUB_SHA']
              if not re.fullmatch(r'[0-9a-f]{40}', workflow_sha):
                  raise ValueError('invalid workflow identity')
              emit('inputs', dict(schema=1, evidence='prospective-only', source=SOURCE, base=BASE,
                                  scan_event=EVENT, workflow_sha=workflow_sha,
                                  config_sha256=CONFIG, ignore_sha256=IGNORE, exclusions=6,
                                  archive_sha256=ARCHIVE, binary_sha256=BINARY, version='8.24.3',
                                  argv=argv, object_inventory_sha256=sha(inventory),
                                  object_inventory_count=len(inventory.splitlines()),
                                  reachable_commits=int(probe('git', 'rev-list', '--all', '--count')),
                                  refs=before))
              p = subprocess.run(argv, capture_output=True, timeout=300, check=False)
              # No raw scanner stream, even on error, enters a log/file/artifact/summary.
              emit('scanner-exit', {'exit': p.returncode})
              findings = safe_findings(p.stdout, p.returncode)
              if refs() != before:
                  raise ValueError('ref mutation during scan')
              for row in findings:
                  probe('git', 'cat-file', '-e', row['Commit'] + '^{commit}')
              emit('result', dict(exit=p.returncode, findings=findings, count=len(findings),
                                  ref_inventory_unchanged=True, raw_streams_retained=False))
              return p.returncode


          if __name__ == '__main__':
              try:
                  raise SystemExit(main())
              except Exception:
                  print('::error::Prospective capture stopped; raw diagnostics suppressed', flush=True)
                  raise SystemExit(1)
          PY
