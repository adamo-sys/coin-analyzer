name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Run syntax-level Ruff checks
        run: ruff check . --select E9 --exclude .venv

  pyright-event-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright==1.1.411

      - name: Type-check cleaned boundaries
        run: pyright event_bus.py image_analyzer.py denomination_label_audit.py market_intelligence_automation.py photo_inbox.py confirmed_observation_evaluator.py diagnostic_agent.py improvement_agent.py retrieval_contracts.py local_retrieval.py atomic_json.py

  openai-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install optional OpenAI dependencies at compatibility floor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt "openai==3.13.0"

      - name: Verify OpenAI SDK surfaces without network access
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import openai_collection_assistant
          from capture_import import visual_identity_provider
          from openai import OpenAI

          assert version("openai") == "3.13.0"
          client = OpenAI(api_key="sk-ci-smoke-test")
          assert callable(client.responses.create)
          assert callable(client.responses.parse)
          assert openai_collection_assistant.OpenAIResponsesAdapter.provider_name == "OpenAI"
          assert visual_identity_provider.OPENAI_VISUAL_PROVIDER_ID == "openai-responses-visual"
          print("OpenAI 3.13.0 optional dependency smoke check passed")
          PY

      - name: Verify OpenAI 3.13.0 transport compatibility without network access
        run: python -m unittest tests.test_openai_sdk_transport_compatibility -v

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Prepare complete Git objects for security scanning
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Full-history scanning is authorized to transfer historical objects.
          # Sparse checkout only limits worktree materialization.
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          fetch_status=0
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --refetch --no-filter origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' \
            "+$CI_SHA:refs/ci/security-event" >/dev/null 2>&1 || fetch_status=$?
          unset auth CI_TOKEN
          printf 'security-diagnostic fetch_exit=%s\n' "$fetch_status"
          test "$fetch_status" -eq 0
          shallow_status=0
          shallow=$(git rev-parse --is-shallow-repository 2>/dev/null) || shallow_status=$?
          case "$shallow" in true|false) ;; *) shallow=UNKNOWN ;; esac
          printf 'security-diagnostic shallow_exit=%s shallow=%s\n' "$shallow_status" "$shallow"
          test "$shallow_status" -eq 0
          { test "$(git rev-parse --is-shallow-repository)" = false; } 2>/dev/null
          inventory_status=0
          git rev-list --objects --all --missing=print > "$RUNNER_TEMP/security-object-inventory.txt" 2>/dev/null || inventory_status=$?
          printf 'security-diagnostic inventory_exit=%s\n' "$inventory_status"
          test "$inventory_status" -eq 0
          # Read metadata only; never hydrate objects or emit raw Git output.
          GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0 python3 - <<'PY'
          import collections
          import os
          import pathlib
          import re
          import shlex
          import subprocess

          def probe(label, *args):
              result = subprocess.run(["git", *args], stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, text=True)
              print(f"security-diagnostic {label}_exit={result.returncode}")
              return result

          try:
              version = probe("version", "--version")
              match = re.fullmatch(r"git version ([0-9]+(?:\.[0-9]+){1,3})\s*", version.stdout)
              print("security-diagnostic git_version=" + (match[1] if match else "UNKNOWN"))
              for key, allowed in (
                  ("extensions.partialclone", r"origin"),
                  ("remote.origin.promisor", r"true|false"),
                  ("remote.origin.partialclonefilter", r"blob:none|blob:limit:[0-9]+[kmg]?|tree:[0-9]+|object:type=(?:blob|tree|commit|tag)|auto"),
              ):
                  result = probe("config", "config", "--get", key)
                  value = result.stdout.strip()
                  safe = value if result.returncode == 0 and re.fullmatch(allowed, value) else (
                      "UNSET" if result.returncode == 1 else "REDACTED")
                  print(f"security-diagnostic {key}={safe}")
              inventory = pathlib.Path(os.environ["RUNNER_TEMP"], "security-object-inventory.txt")
              missing = {line.split()[0][1:] for line in inventory.read_text().splitlines()
                         if line.startswith("?")}
              info = probe("classification", "rev-list", "--objects", "--all",
                           "--missing=print-info", "--no-object-names")
              classes = {}
              if info.returncode == 0:
                  for line in info.stdout.splitlines():
                      if not line.startswith("?"):
                          continue
                      fields = shlex.split(line)
                      types = [field[5:] for field in fields[1:] if field.startswith("type=")]
                      kind = types[0] if len(types) == 1 and types[0] in (
                          "blob", "tree", "commit", "tag") else "UNKNOWN"
                      classes[fields[0][1:]] = kind
              counts = collections.Counter(classes.get(oid, "UNKNOWN") for oid in missing)
              for kind in ("blob", "tree", "commit", "tag", "UNKNOWN"):
                  print(f"security-diagnostic missing_{kind}={counts[kind]}")
              print(f"security-diagnostic missing_total={len(missing)}")
          except Exception:
              print("security-diagnostic diagnostics=UNAVAILABLE")
              raise SystemExit(1)
          PY
          if grep -q '^?' "$RUNNER_TEMP/security-object-inventory.txt"; then
            echo '::error::Full-history security scan requires complete Git objects'
            exit 1
          fi
          rm -- "$RUNNER_TEMP/security-object-inventory.txt"

      - name: Prepare pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan all available Git history for secrets
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # No SARIF, artifact, comment, summary, or verbose finding output.
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config=.gitleaks.toml \
            --log-opts="--full-history --all --root -m --no-ext-diff --no-textconv" \
            --redact=100 --exit-code=2 --log-level=info

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Exclude local-only images from the worktree; Git history is still fetched.
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify architecture and privacy boundaries
        run: >-
          python -m unittest
          tests.test_sprint19_ocr_review_package_boundaries
          tests.test_evaluation_case_contract
          tests.test_repository_privacy_boundaries
          tests.test_ci_security_boundaries
          tests.test_legacy_recognition_orchestration
          tests.test_legacy_coin_recognition_capability
          tests.test_legacy_recognition_integration

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"
