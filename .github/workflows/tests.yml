name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-pwa-browser:
    name: Offline PWA browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: offline_pwa
    env:
      PWA_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python for the synthetic shell builder
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install matching Chromium and Linux dependencies
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run offline PWA browser tests
        run: npm test

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Run syntax-level Ruff checks
        run: ruff check . --select E9 --exclude .venv

  pyright-event-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright==1.1.411

      - name: Type-check cleaned boundaries
        run: pyright event_bus.py image_analyzer.py denomination_label_audit.py market_intelligence_automation.py photo_inbox.py confirmed_observation_evaluator.py diagnostic_agent.py improvement_agent.py retrieval_contracts.py local_retrieval.py atomic_json.py

  openai-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install optional OpenAI dependencies at compatibility floor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ai.txt "openai==3.13.0"

      - name: Verify OpenAI SDK surfaces without network access
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import openai_collection_assistant
          from capture_import import visual_identity_provider
          from openai import OpenAI

          assert version("openai") == "3.13.0"
          client = OpenAI(api_key="sk-ci-smoke-test")
          assert callable(client.responses.create)
          assert callable(client.responses.parse)
          assert openai_collection_assistant.OpenAIResponsesAdapter.provider_name == "OpenAI"
          assert visual_identity_provider.OPENAI_VISUAL_PROVIDER_ID == "openai-responses-visual"
          print("OpenAI 3.13.0 optional dependency smoke check passed")
          PY

      - name: Verify OpenAI 3.13.0 transport compatibility without network access
        run: python -m unittest tests.test_openai_sdk_transport_compatibility -v

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up scanner wrapper Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Acquire complete history objects
        shell: bash
        run: |
          python -B tools/gitleaks_history.py --hydrate

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -m 700 "$RUNNER_TEMP/sec003-gitleaks"
          cd "$RUNNER_TEMP/sec003-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output scanner.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  scanner.tar.gz' | sha256sum --check --status
          tar -xzf scanner.tar.gz --no-same-owner --no-same-permissions gitleaks
          chmod 700 gitleaks

      - name: Scan all available Git history
        shell: bash
        run: |
          python -B tools/gitleaks_history.py "$RUNNER_TEMP/sec003-gitleaks/gitleaks"

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Exclude local-only images from the worktree; Git history is still fetched.
          sparse-checkout: |
            /*
            !/test_coins/*
            /test_coins/README.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify architecture and privacy boundaries
        run: >-
          python -m unittest
          tests.test_sprint19_ocr_review_package_boundaries
          tests.test_evaluation_case_contract
          tests.test_repository_privacy_boundaries
          tests.test_legacy_recognition_orchestration
          tests.test_legacy_coin_recognition_capability
          tests.test_legacy_recognition_integration

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"
