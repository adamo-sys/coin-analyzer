[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Limit the fixture exception to this exact extracted value in these two files.
[[rules.allowlists]]
description = "Known non-secret processed-artifact fixture identifiers"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^normalized-coin-1-front$'''
]
paths = [
  '''^tests[\\/]test_processed_artifact_snapshot\.py$''',
  '''^tests[\\/]test_workflow_execution\.py$'''
]
